name: Build APK and Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Require shared DeepL configuration
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: test -n "$DEEPL_API_KEY" || (echo "::error::DEEPL_API_KEY repository secret is missing" && exit 1)

      - name: Build release APK
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: flutter build apk --release --dart-define="DEEPL_API_KEY=$DEEPL_API_KEY"

      - name: Give APK a friendly name
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Hi-Hat-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Hat-Android-${{ github.sha }}
          path: client/build/app/outputs/flutter-apk/Hi-Hat-Android.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows app
    # flutter_inappwebview 6.2 beta still uses Microsoft's experimental
    # coroutine header, which Visual Studio 18 rejects. VS 2022 remains
    # compatible with the plugin and matches the verified local toolchain.
    runs-on: windows-2022
    env:
      # The WebView2 plugin has large C++ translation units. Serial compilation
      # stays inside the memory available on hosted Windows runners.
      CMAKE_BUILD_PARALLEL_LEVEL: 1
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Require shared DeepL configuration
        shell: pwsh
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEEPL_API_KEY)) {
            Write-Output "::error::DEEPL_API_KEY repository secret is missing"
            exit 1
          }

      - name: Build Windows release
        shell: pwsh
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          & flutter build windows --release --dart-define="DEEPL_API_KEY=$env:DEEPL_API_KEY" 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $errorTail = (Get-Content windows-build.log -Tail 40) -join "`n"
            $errorTail = $errorTail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$errorTail"
            "## Windows build failure" >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content windows-build.log -Tail 80 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            exit $buildExit
          }

      - name: Upload Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-log-${{ github.sha }}
          path: client/windows-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Hat-Windows-${{ github.sha }}
          path: client/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
